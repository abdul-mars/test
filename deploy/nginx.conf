# QRoute — nginx server block.
#
# The document root is public/; nothing above it is reachable, which keeps
# .env, storage/ and src/ off the web entirely.

server {
    listen 80;
    listen [::]:80;
    server_name qrt.example;

    # Redirect to HTTPS. QR codes are printed once, so the scheme they
    # encode should be right the first time.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qrt.example;

    root /var/www/qroute/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/qrt.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qrt.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # A scan should never be held up by a slow upload.
    client_max_body_size 2m;
    client_body_timeout 15s;

    # Compression. QR SVGs compress extremely well.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Static assets are fingerprint-free but rarely change; a day is a
    # reasonable compromise that still lets a CSS fix land quickly.
    location /assets/ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;

        # Required for API key authentication behind php-fpm.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        fastcgi_read_timeout 30s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 8 16k;
    }

    # No other PHP file is a valid entry point.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}

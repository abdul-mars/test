name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # The suite runs against both engines. MySQL is the default the app
  # ships with, so a migration that only works on SQLite must fail CI.
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: qroute_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, gd, mbstring, intl
          coverage: none

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u root --silent && break
            sleep 2
          done

      - name: Test suite against MySQL 8
        env:
          DB_DRIVER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: qroute_test
          DB_USER: root
          DB_PASS: ''
        run: php tests/run.php

      - name: Migrations apply and re-apply cleanly on MySQL 8
        env:
          DB_DRIVER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: qroute_app
          DB_USER: root
          DB_PASS: ''
          APP_KEY: base64:Y2lrZXljaWtleWNpa2V5Y2lrZXljaWtleWNpaz0=
        run: |
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE qroute_app CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          php bin/console migrate
          php bin/console migrate
          # Replaying every statement onto an existing schema must not error,
          # since MySQL has no "CREATE INDEX IF NOT EXISTS".
          mysql -h 127.0.0.1 -u root qroute_app -e "DELETE FROM migrations;"
          php bin/console migrate
          php bin/console seed ci@example.test ci-password-1234
          php bin/console rollup
          php bin/console rollup
          php bin/console stats
          # The generated dump must reproduce the migrated schema exactly.
          php bin/console schema:dump /tmp/schema.sql
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE qroute_sql CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h 127.0.0.1 -u root qroute_sql < /tmp/schema.sql
          for t in users links rules scans scan_daily api_keys sessions settings rate_limits audit_log; do
            a=$(mysql -h 127.0.0.1 -u root -sN qroute_sql -e "SHOW CREATE TABLE $t" | sed 's/AUTO_INCREMENT=[0-9]*//')
            b=$(mysql -h 127.0.0.1 -u root -sN qroute_app -e "SHOW CREATE TABLE $t" | sed 's/AUTO_INCREMENT=[0-9]*//')
            if [ "$a" != "$b" ]; then echo "FAIL: $t differs between schema.sql and migrations"; exit 1; fi
          done
          echo "schema.sql matches the migrations for all tables"
          # An imported schema must leave nothing pending.
          DB_NAME=qroute_sql php bin/console migrate | grep -q 'Nothing to migrate' \
            || { echo "FAIL: imported schema still reports pending migrations"; exit 1; }

      - name: CLI installer refuses to run twice
        env:
          DB_DRIVER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: qroute_twice
          DB_USER: root
          DB_PASS: ''
        run: |
          rm -f storage/installed.lock .env
          php bin/console install admin@example.test a-long-enough-pass http://localhost
          test -f storage/installed.lock || { echo "FAIL: no lock after install"; exit 1; }
          if php bin/console install other@example.test another-long-pass http://localhost; then
            echo "FAIL: installer ran a second time"; exit 1
          fi
          echo "ok: second run refused"
          # An administrator must exist and be the one we named.
          php bin/console admin:list | grep -q admin@example.test \
            || { echo "FAIL: administrator was not created"; exit 1; }
          echo "ok: administrator created"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, gd, mbstring, intl
          coverage: none
          tools: none

      - name: Lint every PHP file
        run: |
          find src public bin tests migrations -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          php -l bin/console > /dev/null

      - name: Run the test suite
        run: php tests/run.php

      - name: Verify migrations apply from scratch
        env:
          DB_DRIVER: sqlite
          DB_PATH: /tmp/ci.sqlite
          APP_KEY: base64:Y2lrZXljaWtleWNpa2V5Y2lrZXljaWtleWNpaz0=
        run: |
          php bin/console migrate
          php bin/console migrate   # must be idempotent
          php bin/console stats

      - name: Installer gates a fresh checkout
        env:
          DB_DRIVER: sqlite
          DB_PATH: /tmp/gate.sqlite
        run: |
          rm -f .env storage/installed.lock storage/install.key
          php -S 127.0.0.1:8877 -t public public/index.php &
          SERVER_PID=$!
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8877/install && break || sleep 0.3; done
          fail=0
          # With no .env and no lock, everything must route to the installer.
          for p in / /pricing /login /app; do
            loc=$(curl -s -o /dev/null -w '%{redirect_url}' "http://127.0.0.1:8877$p")
            case "$loc" in
              *"/install") echo "ok   $p -> installer" ;;
              *) echo "FAIL $p did not route to the installer (got '$loc')"; fail=1 ;;
            esac
          done
          # The wizard itself must render, and its CSS must load.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8877/install)" = "200" ] \
            || { echo "FAIL installer did not render"; fail=1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8877/assets/app.css)" = "200" ] \
            || { echo "FAIL installer CSS blocked by the gate"; fail=1; }
          kill "$SERVER_PID" 2>/dev/null || true
          exit $fail

      - name: Smoke test the HTTP surface
        env:
          DB_DRIVER: sqlite
          DB_PATH: /tmp/smoke.sqlite
          APP_URL: http://127.0.0.1:8899
        run: |
          # The gate step above left the app uninstalled, so set it up the way
          # a real operator would. This exercises the CLI installer too.
          rm -f storage/installed.lock
          php bin/console install ci@example.test ci-password-1234 http://127.0.0.1:8899
          test -f storage/installed.lock || { echo "FAIL: installer did not lock"; exit 1; }
          php bin/console seed
          php -S 127.0.0.1:8899 -t public public/index.php &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8899/health && break || sleep 0.3
          done
          fail=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8899$1")
            if [ "$code" != "$2" ]; then
              echo "FAIL $1 expected $2 got $code"; fail=1
            else
              echo "ok   $1 -> $code"
            fi
          }
          check /            200
          check /pricing     200
          check /login       200
          check /register    200
          check /docs        200
          check /robots.txt  200
          check /health      200
          check /app         302
          check /api/v1/me   401
          check /demo-menu   302
          check /qr/demo-menu.svg 200
          check /qr/demo-menu.png 200
          check /no-such-code     404
          check /admin            302   # signed out, so bounced to login
          # Regression: php -S routes everything through index.php, so the
          # front controller has to hand real files back to the server.
          check /assets/app.css   200
          check /assets/app.js    200
          check /assets/icon.svg  200
          # The front controller itself must not be servable as a static file.
          check /index.php        404
          # A rendered page must never leak a PHP warning.
          for page in / /pricing /app/links/1 /qr/demo-menu.svg; do
            if curl -sL --cookie-jar /tmp/cj "http://127.0.0.1:8899$page" \
               | grep -qiE '<b>(warning|fatal error|notice|deprecated)</b>'; then
              echo "FAIL: PHP diagnostic leaked into $page"; fail=1
            fi
          done
          exit $fail
